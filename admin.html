<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - EnchiladaScan</title>
    <style>
        /* Estilos alineados con la UI de EnchiladaScan */
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --accent-blue: #00acee;
            --text-color: #c9d1d9;
            --input-bg: #090c10;
            --border-radius: 8px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .panel {
            background: var(--panel-bg);
            padding: 40px;
            border-radius: var(--border-radius);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #30363d;
        }

        /* Título con la barra azul igual que en la web */
        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .bar {
            width: 4px;
            height: 24px;
            background: var(--accent-blue);
            border-radius: 2px;
        }

        h3 {
            margin: 0;
            font-size: 1.5rem;
            color: #fff;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #8b949e;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background: var(--input-bg);
            border: 1px solid #30363d;
            border-radius: var(--border-radius);
            color: white;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        /* Botón de ver contraseña */
        .toggle-pass {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--accent-blue);
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
        }

        button.btn-publish {
            width: 100%;
            padding: 14px;
            background: var(--accent-blue);
            border: none;
            color: white;
            cursor: pointer;
            border-radius: var(--border-radius);
            font-weight: bold;
            font-size: 16px;
            transition: opacity 0.2s;
        }

        button.btn-publish:hover {
            opacity: 0.9;
        }

        .log {
            font-size: 13px;
            color: #8b949e;
            margin-top: 20px;
            text-align: center;
            padding: 10px;
            background: rgba(0, 172, 238, 0.05);
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="panel">
        <div class="section-header">
            <span class="bar"></span>
            <h3>Panel Tweets</h3>
        </div>

        <label>Contraseña Maestra</label>
        <div class="input-group">
            <input type="password" id="pass" placeholder="Ingresa el código...">
            <button type="button" class="toggle-pass" onclick="togglePassword()">0.0</button>
        </div>

        <label>Nuevo Tweet</label>
        <div class="input-group">
            <input type="text" id="tweetUrl" placeholder="https://x.com/user/status/...">
        </div>

        <button class="btn-publish" onclick="enviarTweet()">Publicar ahora</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getDatabase, ref, push, remove, query, limitToFirst, get } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyANA4nyzrsexoLj6NgDWBbbuI_Jchltznc",
            authDomain: "enchilada-posts.firebaseapp.com",
            databaseURL: "https://enchilada-posts-default-rtdb.firebaseio.com",
            projectId: "enchilada-posts",
            storageBucket: "enchilada-posts.firebasestorage.app",
            messagingSenderId: "701192037095",
            appId: "1:701192037095:web:043ddeb1ccb75862557842",
            measurementId: "G-BGY8P2YNTQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Función para ver/ocultar contraseña
        window.togglePassword = () => {
            const passInput = document.getElementById('pass');
            passInput.type = passInput.type === 'password' ? 'text' : 'password';
        };

        window.enviarTweet = async () => {
            const pass = document.getElementById('pass').value;
            const url = document.getElementById('tweetUrl').value;
            const log = document.getElementById('log');

            if (pass !== "spypagameconmediopollo") {
                alert("Contraseña incorrecta");
                return;
            }

            if (!url.includes("status")) {
                alert("URL no válida");
                return;
            }

            log.innerText = "Procesando...";
            const tweetsRef = ref(db, 'tweets');
            const snapshot = await get(tweetsRef);

            if (snapshot.exists() && snapshot.size >= 10) {
                const oldestQuery = query(tweetsRef, limitToFirst(1));
                const oldestSnap = await get(oldestQuery);
                oldestSnap.forEach(child => {
                    remove(ref(db, `tweets/${child.key}`));
                });
            }

            push(tweetsRef, url);
            log.innerText = "¡Tweet publicado exitosamente!";
            document.getElementById('tweetUrl').value = "";
        };
    </script>
</body>

</html>
