<header class="scan-header">
  <div class="scan-header__inner">
    <a class="scan-logo" href="{{ site.baseurl }}/">
      <img src="{{ site.baseurl }}/assets/img/header_home.png" alt="Logo del scan en 2.5 Dimensiones">
    </a>

    <form class="scan-search" onsubmit="return false" role="search" aria-label="Buscar capítulos">
      <input id="capsSearch" type="search" placeholder="Buscar capítulo… ej. 12, 13.5">
      <button type="button" id="capsSearchBtn">Buscar</button>
    </form>

    <div class="social-dropdown-wrapper">
      <button id="btn-follow-caps" class="scan-cta">¡Síguenos!</button>

      <div id="social-dropdown-caps" class="social-dropdown-panel">
        <h4>Nuestras Redes</h4>
        <div class="social-grid">
          <a href="https://www.facebook.com/share/18Eh2jhSCq/?mibextid=wwXIfr" target="_blank" class="social-item">
            <img src="{{ site.baseurl }}/assets/img/rs/icon-facebook.png" alt="Facebook">
            <span>Facebook</span>
          </a>
          <a href="https://x.com/EnchiladaScan" target="_blank" class="social-item">
            <img src="{{ site.baseurl }}/assets/img/rs/icon-x.png" alt="X (Twitter)">
            <span>Twitter</span>
          </a>
          <a href="https://discord.gg/uZ6q23tmxg" target="_blank" class="social-item">
            <img src="{{ site.baseurl }}/assets/img/rs/icon-discord.png" alt="Discord">
            <span>Discord</span>
          </a>
          <a href="https://whatsapp.com/channel/0029VbBvhS317Emy4oKuqX1v" target="_blank" class="social-item">
            <img src="{{ site.baseurl }}/assets/img/rs/icon-whatsapp.png" alt="WhatsApp">
            <span>WhatsApp</span>
          </a>
          <a href="https://tmohentai.com/groups/5255" target="_blank" class="social-item">
            <img src="{{ site.baseurl }}/assets/img/rs/icon-tmoh.png" alt="TMO-H">
            <span>Hentailapeño</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</header>

<script>
  (function () {
    /* Lógica de Búsqueda Original */
    var q = document.getElementById('capsSearch');
    var btn = document.getElementById('capsSearchBtn');
    if (q && btn) {
      function filterList(list) {
        if (!list) return;
        var li = list.querySelectorAll('li');
        var needle = (q.value || '').trim().toLowerCase();
        li.forEach(function (item) {
          var txt = (item.textContent || '').toLowerCase();
          var cap = (item.dataset.cap || '').toLowerCase();
          var show = !needle || txt.includes(needle) || cap.includes(needle);
          item.style.display = show ? '' : 'none';
        });
      }
      function apply() {
        filterList(document.getElementById('chaptersList'));
        filterList(document.getElementById('downloadsList'));
      }
      btn.addEventListener('click', apply);
      q.addEventListener('keydown', function (e) { if (e.key === 'Enter') apply(); });
    }

    /* NUEVA Lógica del Desplegable */
    var btnFollow = document.getElementById('btn-follow-caps');
    var panel = document.getElementById('social-dropdown-caps');
    if (btnFollow && panel) {
      btnFollow.addEventListener('click', function (e) {
        e.stopPropagation();
        panel.classList.toggle('show');
      });
      document.addEventListener('click', function (e) {
        if (!panel.contains(e.target) && e.target !== btnFollow) {
          panel.classList.remove('show');
        }
      });
    }
  })();
</script>
