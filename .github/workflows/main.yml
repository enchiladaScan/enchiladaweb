name: Actualizar Tweets Automáticamente
on:
  schedule:
    - cron: '0 */6 * * *' # Se ejecuta cada 6 horas
  workflow_dispatch: # Permite que tú lo ejecutes manualmente para probar

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Instalar dependencias
        run: pip install requests PyYAML
        
      - name: Ejecutar script de Twitter
        env:
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        run: python update_tweets.py
        
      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name 'Twitter Bot'
          git config --global user.email 'bot@github.com'
          git add _data/tweets.yml
          git commit -m "Actualización automática de tweets" || exit 0
          git push