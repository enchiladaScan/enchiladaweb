<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="{{ site.baseurl }}/assets/img/Avatar.png">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | default: site.name }}</title>

    <!-- Usa la ubicación real del CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/theme.css' | relative_url }}">
  </head>
  <body>
    {% if page.header_kind == "home" %}
      {% include header_home.html %}
    {% endif %}
    {{ content }}

    <script>
      (function() {
        document.addEventListener('contextmenu', function(e) {
          e.preventDefault();
        });

        document.addEventListener('keydown', function(e) {
          // Bloquea F12 (Inspeccionar)
          if (e.key === 'F12') e.preventDefault();
          
          if (e.ctrlKey && (e.key === 's' || e.key === 'u' || e.key === 'S' || e.key === 'U')) {
            e.preventDefault();
          }

          if (e.key === 'PrintScreen') {
            navigator.clipboard.writeText('Las capturas de pantalla están deshabilitadas.');
            e.preventDefault();
          }
        });

        document.addEventListener('dragstart', function(e) {
          e.preventDefault();
        });
      })();
  </script>
  </body>
</html>
