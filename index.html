<script>
  (function () {
    const storedTheme = localStorage.getItem('site_theme') || 'dark';
    if (storedTheme === 'light') {
      document.body.classList.add('light-mode');
    } else {
      document.body.classList.remove('light-mode');
    }
  })();
</script>

<div class="ui-theme">

          <source media="(max-width: 768px)" srcset="{{ site.baseurl }}/assets/img/welcome-cel.jpg">
          <img src="{{ site.baseurl }}/assets/img/welcome.jpg" alt="Bienvenidos a Enchilada Scan">
        </picture>
      </div>
      <div class="home-layout">

        <div class="main-content">

          <div class="section-title">
            <span class="bar" style="background: #f59e0b;"></span>

          <!-- NUEVO CONTENEDOR MARQUEE -->
          <div class="marquee-wrapper">
            <div class="marquee-container">
              <div class="marquee-track" id="track-top5"></div>
            </div>
          </div>
          
          <div class="section-title">
            <span class="bar"></span>
            <h2>Activos</h2>
          </div>

          <div class="section-title">
            <span class="bar" style="background: #3b82f6;"></span>

          </div>

          <div class="section-title">
            <span class="bar" style="background: #10b981;"></span>
            <h2>Terminados</h2>
          </div>
          <div class="grid" id="grid-terminados"></div>
        </div>
        <aside class="sidebar">
          <div class="section-title">
            <span class="bar" style="background: #a855f7;"></span>
            <h2>Últimos tweets</h2>
          </div>

          <div class="viewport" id="viewport" title="Pasa el puntero para pausar">
            <div class="scroller" id="scroller">

        const firebaseConfig = {
          apiKey: "AIzaSyCKB0CMfvdKsyVH7yD66liC0WqWb4E9QTE",
          authDomain: "enchiladanossekai.firebaseapp.com",
          projectId: "enchiladanossekai",
          storageBucket: "enchiladanossekai.firebasestorage.app",
          messagingSenderId: "92851491162",
          appId: "1:92851491162:web:93ceb7ae8b35029950a363",
          measurementId: "G-CCCR2V5VJH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // Inicializamos Firestore
        const firestoreDB = getFirestore(app);
        window.firestoreDB = firestoreDB;
        window.getDocs = getDocs;
        window.collection = collection;

        onValue(ref(db, 'tweets'), (snapshot) => {

     <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
      <script src="{{ '/assets/tw/app.js' | relative_url }}"></script>

      <!-- SCRIPT DE LÓGICA -->
      <script>
        (async function () {
          const BASE = '{{ site.baseurl }}';
          const CATALOG_URL = '{{ "/catalogo.json" | relative_url }}';
          const PLACEHOLDER = '/assets/img/cargando_gato.gif';

          const SECTIONS = [
            { key: 'activos', el: 'grid-activos', titleEmpty: 'No hay series activas por el momento.' },
            { key: 'joints', el: 'grid-joints', titleEmpty: 'No hay JOINTS por el momento.' },
            { key: 'terminados', el: 'grid-terminados', titleEmpty: 'No hay series terminadas por el momento.' }
          ];

          try {
            const res = await fetch(CATALOG_URL, { cache: 'no-store' });
            if (!res.ok) throw new Error('No se pudo cargar catalogo.json');
            const data = await res.json();

            let items = [];
            if (Array.isArray(data.items)) {
              items = data.items.map(m => normalizeItem(m));
            } else {
              items = []
                .concat((data.activos || []).map(m => normalizeItem(m, 'activos')))
                .concat((data.joints || []).map(m => normalizeItem(m, 'joints')))
                .concat((data.finalizados || []).map(m => normalizeItem(m, 'terminados')));
            }

            for (const sec of SECTIONS) {
              const list = items.filter(m => m.seccion === sec.key);
              renderSection(sec.el, list, sec.titleEmpty);
            }
            
            // --- LÓGICA TOP 5 ---
            try {
              const querySnapshot = await window.getDocs(window.collection(window.firestoreDB, "vistas_mangas"));
              
              const vistasMap = {};
              querySnapshot.forEach((doc) => {
                vistasMap[doc.id] = doc.data().contador || 0;
              });

              items.forEach(m => {
                const docId = m.href.replace(/^\/+|\/+$/g, '').replace(/\//g, '-'); 
                m.vistas = vistasMap[docId] || 0;
              });

              const top5 = [...items].sort((a, b) => b.vistas - a.vistas).slice(0, 5);
              
              const track = document.getElementById('track-top5');
              if (track && top5.length > 0) {
                const buildMarqueeCard = (m, index) => {
                  const imgSrc = withBase(m.portada);
                  const imgPh = withBase(PLACEHOLDER);
                  return `
                    <a href="${withBase(m.href)}" class="manga-card-marquee">
                      <img src="${imgSrc}" alt="${escapeHtml(m.title)}" loading="lazy" onerror="this.src='${imgPh}'">
                      <div class="card-info">
                        <span class="rank">#${index + 1}</span>
                        <p>${escapeHtml(m.title)}</p>
                      </div>
                    </a>
                  `;
                };

                const cardsHTML = top5.map((m, i) => buildMarqueeCard(m, i)).join('');
                track.innerHTML = cardsHTML + cardsHTML;
              }

            } catch (err) {
              console.error("Error cargando el Top 5, error:", err);
              const track = document.getElementById('track-top5');
              if (track) track.innerHTML = '<p class="no-links" style="color:#fff;">No se pudieron cargar las métricas.</p>';
            }

          } catch (err) {
            console.error("Error cargando el catálogo, error:", err);
            for (const sec of SECTIONS) {
              const el = document.getElementById(sec.el);
              if (el) el.insertAdjacentHTML('beforebegin', `<p class="no-links">No se pudo cargar el catálogo.</p>`);
            }
          }

          // helpers
          function normalizeItem(m, fallbackSection) {
            const portada = m.portada || m.cover || PLACEHOLDER;
            const href = m.post_url || m.url || '#';
            const seccion = (m.seccion || fallbackSection || '').toLowerCase();
            return {
              title: m.title || m.mangaId || '—',
              href, portada, seccion,
              tags: Array.isArray(m.tags) ? m.tags : [],
              latest: m.latest || '—'
            };
          }

          function withBase(u) {
            if (!u) return '#';
            if (/^https?:\/\//i.test(u)) return u;
            if (u[0] !== '/') u = '/' + u;
            return (BASE || '') + u;
          }

          function renderSection(containerId, items, emptyMsg) {
            const $grid = document.getElementById(containerId);
            if (!$grid) return;

            if (!items.length) {
              $grid.insertAdjacentHTML('beforebegin', `<p class="no-links">${escapeHtml(emptyMsg)}</p>`);
              return;
            }

            const fr = document.createDocumentFragment();
            for (const m of items) {
              const card = document.createElement('a');
              card.className = 'card';
              card.href = withBase(m.href);
              card.setAttribute('data-title', m.title);
              card.setAttribute('data-tags', (m.tags || []).join(' '));

              const imgSrc = withBase(m.portada);
              const imgPh = withBase(PLACEHOLDER);

              card.innerHTML = `
        <div class="card-cover">
          <img src="${imgSrc}" alt="${escapeHtml(m.title)}" loading="lazy">
        </div>
        <div class="card-body">
          <h3 class="card-title">${escapeHtml(m.title)}</h3>
          <div class="chips">
            ${(m.tags || []).slice(0, 6).map(t => `<span class="chip">${escapeHtml(t)}</span>`).join('')}
          </div>
          <div class="meta">Último: ${escapeHtml(m.latest)}</div>
        </div>
      `;

              const img = card.querySelector('img');
              img.addEventListener('error', () => { img.src = imgPh; });

              fr.appendChild(card);
            }
            $grid.appendChild(fr);
          }

          function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, m => ({
              '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
          }
        })();
      </script>

      <script>
        const btnTheme = document.getElementById('theme-toggle');
        const iconTheme = document.getElementById('theme-icon');
        const baseurl = "{{ site.baseurl }}";

        if (document.body.classList.contains('light-mode')) {
          iconTheme.src = baseurl + '/assets/img/foco.png';
        } else {
          iconTheme.src = baseurl + '/assets/img/foco-on.png';
        }

        btnTheme.addEventListener('click', () => {
          const isLight = document.body.classList.toggle('light-mode');
          const theme = isLight ? 'light' : 'dark';

          iconTheme.src = baseurl + '/assets/img/' + (isLight ? 'foco.png' : 'foco-on.png');
          localStorage.setItem('site_theme', theme);

          setTimeout(() => { window.location.reload(); }, 150);
        });
      </script>
    </main>
  </div>
</div>
